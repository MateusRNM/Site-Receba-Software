<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/icon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
    <link rel="stylesheet" href="/global.css">
    <link rel="stylesheet" href="index.css">
    <title>Receba Software</title>
</head>
<body>
    <div class="global-container">

        <div class="navbar">
            <div class="navbar-logo">
                <img src="/assets/logo1.png" width="180px" height="70px">
            </div>

            <div class="items">
                <a class="option" href="/index.html">Início</a>
                <a class="option" href="/servicos/index.html">Serviços</a>
                <a class="option" href="/equipe/index.html">Equipe</a>
                <a class="option active" href="/contato/index.html">Contato</a>

        </div>

        <h2>Se interessou por nossos serviços?</h2>
        <h1>Entre em Contato</h1>

        <div class="contact-box">
            <form>
                <input type="text" placeholder="Nome">

                <textarea placeholder="Mensagem"></textarea>
                <button type="button">Enviar Mensagem</button>
            </form>

            <div class="contacts">

                <div class="contact">
                    <div class="icon">
                        <span class="material-symbols-outlined">mail</span>
                    </div>
                    <span>recebasoftware@gmail.com</span>
                </div>

                <div class="contact">
                    <div class="icon">
                        <span class="material-symbols-outlined">phone</span>
                    </div>
                    <span>679999996754</span>
                </div>

                <div class="contact">
                    <div class="icon">
                        <span class="material-symbols-outlined">public</span>
                    </div>
                    <span>@recebasoftware</span>
                </div>

            </div>
        </div>

    </div>
